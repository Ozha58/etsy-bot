name: Telegram onay kontrolü
# Nothing runs continuously. This job starts only:
#  - when the owner writes to the bot or presses a button in Telegram (the Cloudflare Worker starts it), and
#  - 3 times a day on schedule for housekeeping (daily production at 11:20, pins, personalized orders).
on:
  schedule:
    - cron: "20 8 * * *"   # 11:20 Turkey time: starts the daily production
    - cron: "0 14 * * *"   # 17:00
    - cron: "0 18 * * *"   # 21:00
  workflow_dispatch:
    inputs:
      tick:
        description: "Günlük kontrolleri de yap (üretimi başlat, pinler, siparişler)"
        required: false
        default: "0"
concurrency:
  group: poll
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      panel: ${{ steps.poll.outputs.changed }}
    env:
      PYTHONUNBUFFERED: "1"
      DEFER_COMMIT: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TG_WORKER_URL: ${{ secrets.TG_WORKER_URL }}
      TG_WORKER_KEY: ${{ secrets.TG_WORKER_KEY }}
      ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
      ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
      PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      STATE_KEY: ${{ secrets.STATE_KEY }}
      PANEL_PASSWORD: ${{ secrets.PANEL_PASSWORD }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TICK: ${{ github.event_name == 'schedule' && '1' || github.event.inputs.tick || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Telegram'ı işle ve onaylananları yayınla
        id: poll
        run: |
          if [ "$TICK" = "1" ]; then args="--tick"; else args=""; fi
          python -m bot poll $args | tee poll.log
          grep -o 'changed=.*' poll.log | tail -1 | sed 's/changed=True/changed=true/;s/changed=False/changed=false/' >> "$GITHUB_OUTPUT"
      - name: Paneli hazırla
        if: steps.poll.outputs.changed == 'true' && env.TICK == '1'
        run: python -m bot panel --out _site
      - uses: actions/upload-pages-artifact@v3
        if: steps.poll.outputs.changed == 'true' && env.TICK == '1'
        with:
          path: _site
  deploy-panel:
    needs: run
    if: always() && needs.run.outputs.panel == 'true' && (github.event_name == 'schedule' || github.event.inputs.tick == '1')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/deploy-pages@v4
